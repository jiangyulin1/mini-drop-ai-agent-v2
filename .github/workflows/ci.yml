name: release-baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Sync backend and development dependencies from lock
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Verify lock remains frozen
        run: uv lock --check
      - name: Compile and import protobuf contracts
        run: |
          uv run --locked python scripts/compile_proto.py
          uv run --locked python -m compileall -q server/app/generated
      - name: Check repository hygiene
        run: uv run --locked python scripts/check_repo_hygiene.py
      - name: Run backend static checks
        run: uv run --locked python -m ruff check server agent analyzer
      - name: Check migration history and schema drift
        run: uv run --locked python scripts/check_migrations.py
      - name: Validate diagnosis testsets
        run: uv run --locked python scripts/validate_testsets.py testsets
      - name: Check cross-runtime registry consistency
        run: |
          uv run --locked python scripts/check_registry_consistency.py
          uv run --locked python scripts/check_capability_registry.py
      - name: Validate Agent strategy experiment matrix
        run: |
          uv run --locked python scripts/run_agent_strategy_matrix.py --matrix benchmarks/agent_strategy_matrix.example.json --validate-only
          uv run --locked python scripts/run_agent_strategy_matrix.py --matrix benchmarks/agent_experiments/matrix.json --validate-only
      - name: Validate Online Boutique compose
        if: runner.os == 'Linux'
        run: docker compose -f testsets/real/online-boutique/deploy/docker-compose.trimmed.yaml config --quiet
      - name: Run backend tests
        run: uv run --locked python -m pytest -q
      - name: Run deterministic AI evaluation smoke
        run: uv run --locked python scripts/run_lightweight_ai_eval.py --profile smoke --output-dir reports/implementation/ci-eval-smoke

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --include=dev
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pi-sidecar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent_runtime/pi-sidecar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: agent_runtime/pi-sidecar/package-lock.json
      - run: npm ci --include=dev
      - run: npm test
