name: release-baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile and import protobuf contracts
        run: |
          python scripts/compile_proto.py
          python -m compileall -q server/app/generated
      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py
      - name: Check migration history and schema drift
        run: python scripts/check_migrations.py
      - name: Run backend tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm test
      - run: npm run build
