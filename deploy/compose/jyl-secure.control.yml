name: mini-drop-jyl-control

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_drop}
      POSTGRES_USER: ${POSTGRES_USER:-mini_drop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    expose: ["5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_drop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 512m, cpus: "1.0"}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    expose: ["9000", "9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 512m, cpus: "1.0"}

  server:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/server.Dockerfile
    environment:
      MINI_DROP_ENV: vm
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${CONTROL_PUBLIC_ADDRESS:?set CONTROL_PUBLIC_ADDRESS}:${CONTROL_MINIO_TLS_PORT:-9100}
      MINIO_PUBLIC_SECURE: "1"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINIO_AUTO_CREATE_BUCKET: "1"
      MINI_DROP_REQUIRE_STORAGE: "1"
      MINI_DROP_API_AUTH_ENABLED: ${MINI_DROP_API_AUTH_ENABLED:-1}
      MINI_DROP_API_KEY: ${MINI_DROP_API_KEY:?set MINI_DROP_API_KEY}
      MINI_DROP_API_PRINCIPAL_ID: ${MINI_DROP_API_PRINCIPAL_ID:-jyl-operator}
      MINI_DROP_API_ROLES: ${MINI_DROP_API_ROLES:-operator,authorization_admin}
      MINI_DROP_AUTH_COOKIE_SECURE: "1"
      MINI_DROP_GRPC_AUTH_ENABLED: "1"
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN:?set MINI_DROP_GRPC_TOKEN}
      MINI_DROP_GRPC_SECURE: "1"
      MINI_DROP_GRPC_CERT_FILE: /certs/server.crt
      MINI_DROP_GRPC_KEY_FILE: /certs/server.key
      MINI_DROP_GRPC_DISTRIBUTE_MINIO_CREDENTIALS: "0"
      MINI_DROP_REQUIRE_ANALYZER: "1"
      MINI_DROP_ALLOWED_SERVICES: ${MINI_DROP_ALLOWED_SERVICES:-}
      MINI_DROP_TRACING_ENABLED: ${MINI_DROP_TRACING_ENABLED:-0}
      MINI_DROP_ENVIRONMENT: vm
      MINI_DROP_AGENT_RUNTIME: pi
      MINI_DROP_PI_RUNTIME_URL: http://pi-sidecar:8899
      MINI_DROP_PI_INTERNAL_TOKEN: ${MINI_DROP_PI_INTERNAL_TOKEN:?set MINI_DROP_PI_INTERNAL_TOKEN}
      MINI_DROP_AI_ENABLED: ${MINI_DROP_AI_ENABLED:-full}
      MINI_DROP_AI_PROVIDER: ${MINI_DROP_AI_PROVIDER:-deepseek}
      MINI_DROP_AI_BASE_URL: ${MINI_DROP_AI_BASE_URL:-https://api.deepseek.com}
      MINI_DROP_AI_API_KEY: ${MINI_DROP_AI_API_KEY:?set MINI_DROP_AI_API_KEY}
      MINI_DROP_AI_MODEL: ${MINI_DROP_AI_MODEL:-deepseek-v4-flash}
    ports:
      - "0.0.0.0:${CONTROL_GRPC_PORT:-51051}:50051"
    expose: ["8191"]
    volumes:
      - ../certs:/certs:ro
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8191/api/readyz?core_only=true' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 1g, cpus: "2.0"}

  analyzer:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/server.Dockerfile
    command: ["python", "-m", "analyzer.mini_drop_analyzer.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINI_DROP_GRPC_SECURE: "0"
      MINI_DROP_ANALYZER_UPLOAD: "1"
      MINI_DROP_TRACING_ENABLED: ${MINI_DROP_TRACING_ENABLED:-0}
      MINI_DROP_ENVIRONMENT: vm
    depends_on:
      server: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 1g, cpus: "1.5"}

  web:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/web.jyl-secure.Dockerfile
    ports:
      - "0.0.0.0:${CONTROL_HTTPS_PORT:-80}:8443"
      - "0.0.0.0:${CONTROL_MINIO_TLS_PORT:-9100}:9443"
    volumes:
      - ../certs:/certs:ro
    depends_on:
      server: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:8443/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 256m, cpus: "0.5"}

  pi-sidecar:
    build:
      context: ../..
      dockerfile: deploy/dockerfiles/pi-sidecar.Dockerfile
    environment:
      MINI_DROP_PI_SIDECAR_PORT: "8899"
      MINI_DROP_PI_INTERNAL_BASE: http://server:8191
      MINI_DROP_PI_INTERNAL_TOKEN: ${MINI_DROP_PI_INTERNAL_TOKEN:?set MINI_DROP_PI_INTERNAL_TOKEN}
      DEEPSEEK_API_KEY: ${MINI_DROP_AI_API_KEY:?set MINI_DROP_AI_API_KEY}
      MINI_DROP_PI_MODEL_PROVIDER: ${MINI_DROP_AI_PROVIDER:-deepseek}
      MINI_DROP_PI_MODEL: ${MINI_DROP_AI_MODEL:-deepseek-v4-flash}
      MINI_DROP_PI_THINKING_LEVEL: ${MINI_DROP_PI_THINKING_LEVEL:-high}
    expose: ["8899"]
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 512m, cpus: "1.0"}

volumes:
  pgdata:
  miniodata:
