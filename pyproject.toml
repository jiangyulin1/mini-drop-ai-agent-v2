[project]
name = "micro-drop"
version = "0.1.0"
description = "Mini-Drop: a lightweight Linux performance profiling platform"
requires-python = ">=3.9,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "eval_type_backport>=0.2.0",
    # greenlet 3.2 no longer publishes CPython 3.9 wheels. SQLAlchemy pulls it
    # on common platforms, so keep the last wheel-backed line for Python 3.9.
    "greenlet>=3.1,<3.2; python_version < '3.10'",
    "grpcio>=1.80,<1.81",
    "protobuf>=6.33.5,<7",
    "psycopg[binary]>=3.1",
    "minio>=7.0",
    # knowledge_memory imports NumPy at server startup, including the lexical
    # (network-free) provider path used by the native deployment.
    "numpy>=2.0,<3",
    "pgvector>=0.3,<1",
    "python-docx>=1.1,<2",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "py-spy>=0.3",
    "requests>=2.28",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
embedding-local = [
    "fastembed>=0.7,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "grpcio-tools>=1.80,<1.81",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
    "paramiko>=3.4,<4",
    "loguru>=0.7",
    "ruff>=0.9,<1",
]
mcp = [
    "mcp>=2.0,<3; python_version >= '3.10'",
]
orchestration = [
    # Optional open-source graph/workflow runtimes.  The default deployment
    # remains Python 3.9-compatible and does not import either package.
    "langgraph>=0.6,<1; python_version >= '3.10'",
    "temporalio>=1.18,<2; python_version >= '3.10'",
    "networkx>=3.2,<4",
]

[tool.ruff.lint]
# Start with correctness and dead-code rules. Broader style modernization is
# intentionally incremental so collector fallback behavior is not rewritten
# mechanically.
select = ["E9", "F63", "F7", "F82", "F401", "F841", "F541", "F601", "B023"]

[project.scripts]
micro-drop = "server.app.cli:main"
mini-drop-mcp = "server.app.mcp_integration.server:main"

[tool.setuptools.packages.find]
include = ["server*", "agent*", "analyzer*", "mini_drop_observability*", "mini_drop_contracts*"]
exclude = ["web*", "demo*", "deploy*", "docs*", "tests*"]

[tool.setuptools.package-data]
mini_drop_contracts = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-work"
cache_dir = ".pytest-cache"
